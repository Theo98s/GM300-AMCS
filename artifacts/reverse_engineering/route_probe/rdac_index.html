		//初始化表单隐藏域
		 function appendToken(){ 
           updateForms(); 
           //updateTags(); 
        } 
     
        function updateForms() { 
           // 得到页面中所有的 form 元素
           var forms = document.getElementsByTagName('form'); 
           for(i=0; i<forms.length; i++) { 
               // var url = forms[i].action; 
         
               // 如果这个 form 的 action 值为空，则不附加 csrftoken 
               // if(url == null || url == "" ) continue; 
         
               // 动态生成 input 元素，加入到 form 之后
               var e = document.createElement("input"); 
               e.name = "CSRFToken"; 
               e.value = csrftoken; 
               e.type="hidden"; 
               forms[i].appendChild(e); 
            } 
        } 
     
        function updateTags() { 
           var all = document.getElementsByTagName('a'); 
           var len = all.length; 
         
           // 遍历所有 a 元素
           for(var i=0; i<len; i++) { 
               var e = all[i]; 
               updateTag(e, 'href', csrftoken); 
           } 
        } 
         
        function updateTag(element, attr, token) { 
           var location = element.getAttribute(attr); 
           if(location != null && location != '' ) { 
               var fragmentIndex = location.indexOf('#'); 
               var fragment = null; 
               if(fragmentIndex != -1){ 
         
                   //url 中含有只相当页的锚标记
                   fragment = location.substring(fragmentIndex); 
                   location = location.substring(0,fragmentIndex); 
               } 
                
               var index = location.indexOf('?'); 
         
               if(index != -1) { 
                   //url 中已含有其他参数
                   location = location + '&CSRFToken=' + csrftoken; 
               } else { 
                   //url 中没有其他参数
                   location = location + '?CSRFToken=' + csrftoken; 
               } 
               if(fragment != null){ 
                   location += fragment; 
               } 
                
               element.setAttribute(attr, location); 
           } 
        }

	</script>

	  //设置cookie
	  function setCookie(cname, cvalue, exdays) {
	      var d = new Date();
	      d.setTime(d.getTime() + (exdays*24*60*60*1000));
	      var expires = "expires="+d.toUTCString();
	      document.cookie = cname + "=" + encodeURIComponent(cvalue) + "; " + expires;
	      //document.cookie = cname + "=" + cvalue + "; " + expires;
	  }

	  //获取cookie
	  function getCookie(cname) {
	      var name = cname + "=";
	      var ca = document.cookie.split(';');
	      for(var i=0; i<ca.length; i++) {
	          var c = ca[i];
	          while (c.charAt(0)==' ') c = c.substring(1);
	          if (c.indexOf(name) != -1) return decodeURIComponent(c.substring(name.length, c.length));
	          //if (c.indexOf(name) != -1) return c.substring(name.length, c.length);
	      }
	      return "";
	  }

	  //清除cookie  
	  function clearCookie(name) {  
	      setCookie(name, "", -1);  
	  }

	  //将用户数据存储到浏览器缓存
	  function storeAccountData(account){

	  	if(!account){
	  		return ;
	  	}
	  	//判断浏览器是否支持 localStorage
	  	if(window.localStorage){
	  		var rmIndex;
            var ls=window.localStorage;
            //获取历史用户信息
            var accounts= JSON.parse(ls.getItem("accounts"));
            if(!accounts){
            	accounts = new Array(5);
            }
            //判断新增数据是否已存在历史记录中
            accounts.forEach(function(item,index,array){
            	if(account == item){
            		rmIndex = index;
            	}
            })
            //删除已存在的账号
            if(rmIndex==0 || rmIndex){
            	accounts.splice(rmIndex,1);
            }

            //将新元素添加到数组最前面
            accounts.unshift(account);

            //只保留最近五个登录账号
            accounts.length = 5 ;
           
            //将值设置到缓存中
            ls.setItem("accounts",JSON.stringify(accounts));//设置值
            
        }

	  }

	//获取账号历史数据

            if(!accounts){

            }
            accounts.forEach(function(item){
            	if(item){

            	}
            	
            })
        return str;
	  	}
	}

    <script type="text/javascript">
		var ctx="";
		var resPath="/res";
		var csrftoken = "d013239f-d8f8-4f6c-92e4-73b064ff49d0";
		var projectVersion="V1.4.13.0-20260306-3";

		//初始化表单隐藏域
		 function appendToken(){ 
           updateForms(); 
           //updateTags(); 
        } 
     
        function updateForms() { 
           // 得到页面中所有的 form 元素
           var forms = document.getElementsByTagName('form'); 
           for(i=0; i<forms.length; i++) { 
               // var url = forms[i].action; 
         
               // 如果这个 form 的 action 值为空，则不附加 csrftoken 
               // if(url == null || url == "" ) continue; 
         
               // 动态生成 input 元素，加入到 form 之后
               var e = document.createElement("input"); 
               e.name = "CSRFToken"; 
               e.value = csrftoken; 
               e.type="hidden"; 
               forms[i].appendChild(e); 
            } 
        } 
     
        function updateTags() { 
           var all = document.getElementsByTagName('a'); 
           var len = all.length; 
         
           // 遍历所有 a 元素
           for(var i=0; i<len; i++) { 
               var e = all[i]; 
               updateTag(e, 'href', csrftoken); 
           } 
        } 
         
        function updateTag(element, attr, token) { 
           var location = element.getAttribute(attr); 
           if(location != null && location != '' ) { 
               var fragmentIndex = location.indexOf('#'); 
               var fragment = null; 
               if(fragmentIndex != -1){ 
         
                   //url 中含有只相当页的锚标记
                   fragment = location.substring(fragmentIndex); 
                   location = location.substring(0,fragmentIndex); 
               } 
                
               var index = location.indexOf('?'); 
         
               if(index != -1) { 
                   //url 中已含有其他参数
                   location = location + '&CSRFToken=' + csrftoken; 
               } else { 
                   //url 中没有其他参数
                   location = location + '?CSRFToken=' + csrftoken; 
               } 
               if(fragment != null){ 
                   location += fragment; 
               } 
                
               element.setAttribute(attr, location); 
           } 
        }

	</script>

		<script type="text/javascript">
			var subName = '???????';
			var protocol = '104';
			var telesignal = '#telesignalDatagrid';
			var telemetry = '#telemetryDatagrid';
			var remoteControl = '#remoteControlDatagrid';
			var remoteAdjust = '#remoteAdjustDatagrid';
			var partialDischarge = "#partialDischargeDatagrid"
			var nameOrRef = "#nameOrRefTextbox";
			var itemsTabs = '#itemsTabs';
			var adjustItems = [];
			var controlItems = [];
			var metryItems = [];
			var signalItems = [];
			var pdItems = [];
			let station_status_name="通信管理机.通信状态";


			$(function () {
				initItems();

				initSearchTextbox();
				$('#tabBox li').click(function () {
					let index = $(this).index();
					$('#tabBox li').removeClass('tabs-selected').eq(index).addClass('tabs-selected');
					$('#itemsTabs >div').hide().eq(index).show();
				})

			});
			function changeTab(index) {
				$('#tabBox li').removeClass('tabs-selected').eq(index).addClass('tabs-selected');
				$('#itemsTabs >div').hide().eq(index).show();
			}
			function getTabIndex(){
				return $('#tabBox .tabs-selected').index();
			}
			function initItems() {
				load();
				ajaxJson(ctx + "/rdac/itemList", { subName: subName, protocol: protocol }, function (result) {
					disLoad();
					var data = result.data;
					adjustItems = data.remoteAdjustItems;
					controlItems = data.remoteControlItems;
					metryItems = data.telemetryItems;
					signalItems = data.telesignalItems;
					pdItems = data.partialDischargeItems;
					initTelesignal();
					initTelemetry();
					initRemoteControl();
					initRemoteAdjust();
					initPartialDischarge();
				});
			}
			function initSearchTextbox() {
				$(nameOrRef).textbox({
					prompt: '请输入属性或点地址...',
					width: 320,
					icons: [
						{
							iconCls: 'iconfont icon-guanbi3',
							handler: function (e) {
								$(e.data.target).textbox('clear').textbox('textbox').focus();
								$(this).css('visibility', 'hidden');
								searchNameOrRef();
							}
						},
						{
							iconCls: 'iconfont icon-sousuochaxun',
							handler: searchNameOrRef
						},
					]
				});
				$(nameOrRef).textbox('textbox').bind('keydown', function (e) {
					if (e.keyCode == 13) {	// 当按下回车键时接受输入的值。
						$(nameOrRef).textbox('setValue', $(this).val());
						searchNameOrRef();
					}
				});
				$(nameOrRef).textbox('textbox').bind('keyup', function () {
					var icon = $(nameOrRef).textbox('getIcon', 0);
					var text = $(this).val();
					if (text) {
						icon.css('visibility', 'visible');
					} else {
						icon.css('visibility', 'hidden');
					}
				});
				$(nameOrRef).textbox('getIcon', 0).css('visibility', 'hidden');
			}
			function searchNameOrRef() {
				var nameOrRefKeyword = $(nameOrRef).textbox('getValue');
				var signalFilters = { rows: [], total: 0 };
				var metryFilters = { rows: [], total: 0 };
				var controlFilters = { rows: [], total: 0 };
				var adjustFilters = { rows: [], total: 0 };
				var pdFilters = { rows: [], total: 0 };
				if (nameOrRefKeyword) {
					signalFilters.rows = signalItems.filter((ele) => { return ele.name.indexOf(nameOrRefKeyword) > -1 || ele.reference.indexOf(nameOrRefKeyword) > -1 });
					metryFilters.rows = metryItems.filter((ele) => { return ele.name.indexOf(nameOrRefKeyword) > -1 || ele.reference.indexOf(nameOrRefKeyword) > -1 });
					controlFilters.rows = controlItems.filter((ele) => { return ele.name.indexOf(nameOrRefKeyword) > -1 || ele.reference.indexOf(nameOrRefKeyword) > -1 });
					adjustFilters.rows = adjustItems.filter((ele) => { return ele.name.indexOf(nameOrRefKeyword) > -1 || ele.reference.indexOf(nameOrRefKeyword) > -1 });
					pdFilters.rows = pdItems.filter((ele) => { return ele.name.indexOf(nameOrRefKeyword) > -1 || ele.reference.indexOf(nameOrRefKeyword) > -1 });
				} else {
					signalFilters.rows = signalItems;
					metryFilters.rows = metryItems;
					controlFilters.rows = controlItems;
					adjustFilters.rows = adjustItems;
					pdFilters.rows = pdItems;
				}
				signalFilters.total = signalFilters.rows.length;
				metryFilters.total = metryFilters.rows.length;
				controlFilters.total = controlFilters.rows.length;
				adjustFilters.total = adjustFilters.rows.length;
				pdFilters.total = pdFilters.rows.length;
				$(telesignal).edatagrid('loadData', signalFilters);
				$(telemetry).edatagrid('loadData', metryFilters);
				$(remoteControl).edatagrid('loadData', controlFilters);
				$(remoteAdjust).edatagrid('loadData', adjustFilters);
				$(partialDischarge).edatagrid('loadData', pdFilters);
			}
			function saveItems() {
				// 1、先校验行编辑是否验证通过并结束行编辑
				if (!validateRow(telesignal)) {
					changeTab(0);
					return;
				}
				if (!validateRow(telemetry)) {
					changeTab(1);
					return;
				}
				if (!validateRow(remoteControl)) {
					changeTab(2);
					return;
				}
				if (!validateRow(remoteAdjust)) {
					changeTab(3);
					return;
				}
				if (!validateRow(partialDischarge)) {
					changeTab(4);
					return;
				}
				// 3、校验点地址是否存在相同
				if (!checkItems(signalItems)) {
					changeTab(0);
					return;
				}
				if (!checkItems(metryItems)) {
					changeTab(1);
					return;
				}
				if (!checkItems(controlItems)) {
					changeTab(2);
					return;
				}
				if (!checkItems(adjustItems)) {
					changeTab(3);
					return;
				}
				if (!checkItems(pdItems)) {
					changeTab(4);
					return;
				}
				/**
				 * 通信状态无需保存
				 */
				let tempSignalItems = spliceStationStatus(signalItems);
				// 4、更新站点列表数据
				load();
				ajaxJson(ctx + "/rdac/itemsUpdate", { subName: subName, protocol: protocol, telesignalItems: tempSignalItems, telemetryItems: metryItems, remoteAdjustItems: adjustItems, remoteControlItems: controlItems, partialDischargeItems: pdItems }, function (result) {
					disLoad();
					if (result.status == 0) {
						// 5、保存成功之后接受变更,不需要刷新页面
						$(telesignal).edatagrid('acceptChanges');
						$(telemetry).edatagrid('acceptChanges');
						$(remoteAdjust).edatagrid('acceptChanges');
						$(remoteControl).edatagrid('acceptChanges');
						$(partialDischarge).edatagrid('acceptChanges');
						Msg.info("保存成功");
					} else {
						MsgError(result.message);
					}
				});
			}

			/**
			 * 剔除通信状态
			 * @param items
			 * @returns {*[]}
			 */
			function spliceStationStatus(items){
				let temp = [].concat(items);
				let index = -1;
				for (var i = 0; i < temp.length; i++) {
					let item = temp[i];
					if(item.name.indexOf(station_status_name) >= 0){
						index = i;
						break;
					}
				}
				if(index >= 0 && index < temp.length){
					temp.splice(index,1);
				}
				return temp;

			}
			function checkItems(items) {
				for (var i = 0; i < items.length; i++) {
					for (var j = i + 1; j < items.length; j++) {
						if (items[i].name === items[j].name || items[i].reference === items[j].reference) {
							MsgError("第" + (i + 1) + "行与第" + (j + 1) + "行的属性或点地址相同")
							return false;
						}
					}
				}
				return true;
			}

			function copyItems() {
				var datagridId = getTabIndexAndDatagrid();
				var checkedRows = $(datagridId).edatagrid('getChecked');
				if (checkedRows.length == 0) {
					MsgError('请勾选需要复制的记录!');
					return;
				}
				var rows = $(datagridId).edatagrid('getData').firstRows;
				var arr = rows.map(row => {
					var ref = row.reference;
					var str = ref.substring(13, 18);
					return Number(str);
				});
				var max = Math.max.apply(null, arr);
				$.messager.confirm('确认', '您确认要复制已勾选的记录吗？', function (r) {
					if (r) {
						if (!validateRow(datagridId)) {
							return;
						}
						var rowsIndex = rows.length - 1;
						// 数组对象深复制
						var checkedRowsData = JSON.parse(JSON.stringify(checkedRows));
						$(datagridId).edatagrid('uncheckAll');
						for (var i = 0; i < checkedRowsData.length; i++) {
							// 重置点地址，点地址不允许重复
							var ref = checkedRowsData[i].reference;
							var prefix = ref.substring(0, 13);
							var suffix = ref.substring(18, ref.length);
							var reference = "00000" + String(max + i + 1);
							checkedRowsData[i].reference = prefix + reference.substring(reference.length-5) + suffix;
							// 新增一行并选中复选框
							$(datagridId).edatagrid('appendRow', checkedRowsData[i]);
							$(datagridId).edatagrid('checkRow', (rowsIndex + i + 1));
						}
						//滚动到复制数据的第一行
						$(datagridId).edatagrid('scrollTo', rowsIndex+1);
					}
				});
			}
			function validateRow(datagridId) {
				var rowIndex = $(datagridId).edatagrid('getRowIndex', undefined);
				var editIndex = $(datagridId).edatagrid('getRowIndex', $(datagridId).edatagrid('getSelected'));
				return validRowIndex(datagridId, editIndex) && validRowIndex(datagridId, rowIndex);
			}
			function endEditAndGetChanges(datagridId) {
				var rowIndex = $(datagridId).edatagrid('getRowIndex', undefined);
				var editIndex = $(datagridId).edatagrid('getRowIndex', $(datagridId).edatagrid('getSelected'));
				if (rowIndex != -1) {
					$(datagridId).edatagrid('endEdit', rowIndex);
				}
				if (editIndex != -1) {
					$(datagridId).edatagrid('endEdit', editIndex);
				}
				return $(datagridId).edatagrid('getChanges');
			}
			function validRowIndex(datagridId, rowIndex) {
				if (rowIndex == -1) {
					return true;
				}
				if ($(datagridId).edatagrid('validateRow', rowIndex)) {
					$(datagridId).edatagrid('endEdit', rowIndex);
					$(datagridId).edatagrid('refreshRow', rowIndex);
				} else {
					$(datagridId).edatagrid('selectRow', rowIndex);
					$(datagridId).edatagrid('scrollTo', rowIndex);
					MsgError("第" + (rowIndex + 1) + "行输入参数有误，请先验证!");
					return false;
				}
				return true;
			}
			function appendItems() {
				var datagridId = getTabIndexAndDatagrid();
				if (validateRow(datagridId)) {
					var row = { 'ck': false, cache: '1', store: '1', period: 600, select: '1', type:'DEE'};
					if(datagridId == partialDischarge){
						row.type = 'PSE';
					}
					$(datagridId).edatagrid('appendRow', row);
					var appendRowIndex = $(datagridId).edatagrid('getData').firstRows.length - 1;
					$(datagridId).datagrid('scrollTo', appendRowIndex);
					$(datagridId).datagrid('selectRow', appendRowIndex).datagrid('beginEdit', appendRowIndex);
				}
			}
			function rejectItems() {
				$.messager.confirm('确认', '您确认要重置当前页面的数据吗？', function (r) {
					if (r) {
						var datagridId = getTabIndexAndDatagrid();
						$(datagridId).edatagrid('rejectChanges');
						$(datagridId).edatagrid('scrollTo', 0);
						Msg.success('操作成功');
					}
				});
			}
			function removeItems() {
				var datagridId = getTabIndexAndDatagrid();
				var checkedRows = $(datagridId).edatagrid('getChecked');
				if (checkedRows.length == 0) {
					MsgError('请勾选需要删除的记录!');
					return;
				}
				$.messager.confirm('确认', '您确认要删除已勾选的记录吗？', function (r) {
					if (r) {
						delItems(datagridId);
						$(datagridId).edatagrid('clearChecked');
					}
				});
			}
			function delItems(id) {
				var checkedRows = $(id).edatagrid('getChecked');
				if (checkedRows.length > 0) {
					var rowIndex = $(id).edatagrid('getRowIndex', checkedRows[0]);
					$(id).edatagrid('deleteRow', rowIndex);
					delItems(id);
				} else {
					Msg.success('操作成功')
				}
			}
			function getTabIndexAndDatagrid() {
				var tabIndex = getTabIndex();
				var tabId = '';
				switch (tabIndex) {
					case 0:// 遥信
						tabId = telesignal;
						break;
					case 1:// 遥测
						tabId = telemetry;
						break;
					case 2:// 遥控
						tabId = remoteControl;
						break;
					case 3:// 遥调
						tabId = remoteAdjust;
						break;
					case 4:// 局放
						tabId = partialDischarge;
						break;
				}
				return tabId;
			}
			$.extend($.fn.validatebox.defaults.rules, {
				nameFormat: {
					validator: function (value) {
						var sea = value.split('\__');
						var sub = sea[0];
						if ((sea && sea.length < 2) || !sub) {
							return false;
						}
						var ea = sea[1].split('\.');
						if (ea && ea.length < 2) {
							return false;
						}
						var equip = ea[0];
						var attr = ea[1];
						if (!equip || !attr) {
							return false;
						}
						return true;
					},
					message: '格式不正确，标准格式：站名__设备名.属性'
				},
				refFormat: {
					validator: function (value) {
						if (value.indexOf("\.") > -1) {
							value = value.substring(0, value.indexOf("\."))
						}
						var ref = value.split('\_');
						if (ref && ref.length < 4) {
							return false;
						}
						var aab = ref[0];
						var ccc = ref[1];
						var eeee = ref[2];
						var fffff = ref[3];
						if (aab && aab.length == 3 && ccc && ccc.length == 3 && eeee && eeee.length == 4 && fffff && fffff.length == 5) {
							return true;
						}
						return false;
					},

			var typeEditor = { type: 'combobox', options: { valueField: 'value', textField: 'text', editable: false, panelHeight: 110, limitToList: true, data: [{ value: 'DEE', text: '动环' }, { value: 'PSC', text: 'PSCADA' }, { value: 'PSE', text: '在线监测' }]}};

			function onBeginEdit(index, row){
				if (row.name.indexOf(station_status_name) >= 0) {
					// $(this).edatagrid('disableEditing');
					$(this).edatagrid('cancelEdit',index);
				}
			}
			function onClickCell(index, field, value) {

				let editors = $(this).edatagrid('getEditors', index);

				var select = $(this).edatagrid('getSelected');
				if (select) {
					var rowIndex = $(this).edatagrid('getRowIndex', select);
					if (rowIndex != index) {
						if ($(this).edatagrid('validateRow', rowIndex)) {
							$(this).edatagrid('endEdit', rowIndex);
							$(this).edatagrid('refreshRow', rowIndex);
						} else {
							$(this).edatagrid('selectRow', rowIndex);
						}
					}
				}
			}
			function booleanFormatter(value, row, index) {
				var html;
				if (value == 1) {
					html = '<span style="color:green">是</span>';
				} else {
					html = '<span style="color:red">否</span>';
				}
				return html;
			}
			function typeFormatter(value, row, index) {
				var html;
				if (value === 'DEE') {
					html = '动环';
				}
				if (value === 'PSC') {
					html = 'PSCADA'
				}
				if (value === 'PSE') {
					html = '在线监测';
				}
				return html;
			}
			function rateFormatter(value, row, index) {
				var html = '';
				if (value) {
					html += value + '<span style="color:green">%</span>';
				}
				return html;
			}

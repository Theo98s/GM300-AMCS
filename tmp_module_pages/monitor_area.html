		//初始化表单隐藏域
		 function appendToken(){ 
           updateForms(); 
           //updateTags(); 
        } 
     
        function updateForms() { 
           // 得到页面中所有的 form 元素
           var forms = document.getElementsByTagName('form'); 
           for(i=0; i<forms.length; i++) { 
               // var url = forms[i].action; 
         
               // 如果这个 form 的 action 值为空，则不附加 csrftoken 
               // if(url == null || url == "" ) continue; 
         
               // 动态生成 input 元素，加入到 form 之后
               var e = document.createElement("input"); 
               e.name = "CSRFToken"; 
               e.value = csrftoken; 
               e.type="hidden"; 
               forms[i].appendChild(e); 
            } 
        } 
     
        function updateTags() { 
           var all = document.getElementsByTagName('a'); 
           var len = all.length; 
         
           // 遍历所有 a 元素
           for(var i=0; i<len; i++) { 
               var e = all[i]; 
               updateTag(e, 'href', csrftoken); 
           } 
        } 
         
        function updateTag(element, attr, token) { 
           var location = element.getAttribute(attr); 
           if(location != null && location != '' ) { 
               var fragmentIndex = location.indexOf('#'); 
               var fragment = null; 
               if(fragmentIndex != -1){ 
         
                   //url 中含有只相当页的锚标记
                   fragment = location.substring(fragmentIndex); 
                   location = location.substring(0,fragmentIndex); 
               } 
                
               var index = location.indexOf('?'); 
         
               if(index != -1) { 
                   //url 中已含有其他参数
                   location = location + '&CSRFToken=' + csrftoken; 
               } else { 
                   //url 中没有其他参数
                   location = location + '?CSRFToken=' + csrftoken; 
               } 
               if(fragment != null){ 
                   location += fragment; 
               } 
                
               element.setAttribute(attr, location); 
           } 
        }

	</script>

<script type="text/javascript">
	window.onbeforeunload = function (e) {
        if (parent && parent.playerWndSetting && parent.playerWndSetting.state != undefined) {
            parent.playerWndSetting.state = false;
        }

    $(function(){
    	$('#conditionForm .easyui-textbox').textbox({
            iconWidth:20,
            icons:[{
                iconCls:'iconfont icon-guanbi3',
                handler: function(e){
                    $(e.data.target).textbox('clear');
                }
            }]
        });
    	
    	queryData();
    	
    	$(document).keydown(function (event) {
            if (event.keyCode == 13) {
                queryData();
            }
        });
    })
    
    function getQueryParams(){
    	var data = {
            cameraName: $("#cameraName").val(),
            equipName: $("#equipQueryName").val(),
            keyword: $("#keyword").val()
        };
    	return data;
    }
    
    function queryData() {
        $('#areaTable').datagrid({
            url: "/amcs/monitorArea/findPage",
            pagination: true,
            pageSize: 10,
            pageList : [10, 20, 30, 40, 50],
            nowrap : false,
            fit : true,
            fitColumns : true,
            border : false,
            idField : 'id',
            multiSort : true,
            queryParams : getQueryParams(),
            columns: [[
                { title: 'id', field: 'id', width: '5%', checkbox: true },
                { title: '操作', field: 'c', align: 'center', width: '15%', formatter: toOperate },
				{ title: '摄像机名称', field: 'cameraName', align: 'center', width: '24%' },
				{ title: '设备名称', field: 'equipName', align: 'center', width: '20%',formatter:formatValue },
                { title: '预置位名称', field: 'presetName', align: 'center', width: '20%' },
                { title: '预置位编号', field: 'presetNum', align: 'center', width: '20%' }
            ]],
            onLoadError:function (n) {
                $.messager.show({
                    title: '错误',
                    msg: '列表数据加载失败！'
                });
            }
        });
    }
    
    function toOperate(value, row, index) {
        var html = '<a href="javascript:void(0);" class="tx_blue"'
            + ' onClick="javascript:showAddDialog(\''
            + row.id
            + '\',1);">查看</a>';
        if ($("#edit")[0]) {
            html += '&nbsp;|&nbsp;  <a href="javascript:void(0);" class="tx_orange"  onclick="showAddDialog(\''
                + row.id
                + '\',0)">编辑</a>';
        }
        return html;
    }
    
    function showAddDialog(id, readonly) {
        var url = '/amcs/monitorArea/editPage?id=' + id + "&readonly=" + readonly;
        var title = (readonly == 1) ? "查看巡检点位" : (id ? "编辑巡检点位" : "新增巡检点位");

        sy.openEasyUIDialog({
        	isTop:true,
            title: title,
            fit: false,
            width: '1600px',
            height: '800px',
            modal: true,
            closed: true,
            contentUrl: url,
            callback: function (dom, flag) {
				$("#areaTable").datagrid("reload");
       	    }
        });
    }


    
  	//批量刪除
    function batchDelete() {
        var rows = $('#areaTable').datagrid('getSelections');
        if (rows.length <= 0) {
            Msg.warning("警告", "请选择一条记录来删除！");
            return;
        }

        var objArr = [];
        var ids = [];
        for (var i = 0; i < rows.length; i++) {
            var obj = {
                'id':'',
                'equipName':'',
                'cameraName':'',
                'presetName':'',
                'presetNum':''
            };
            obj.id = rows[i].id;
            ids.push(rows[i].id);
            obj.equipName = rows[i].equipName;
            obj.cameraName = rows[i].cameraName;
            obj.presetName = rows[i].presetName;
            obj.presetNum = rows[i].presetNum;
            objArr.push(obj);
        }
        doDeleteEntity(ids, objArr, rows.length);
    }
  	
  	//删除巡检点位
    function doDeleteEntity(ids, objArr, num) {
        if (!ids || ids.length == 0) {
            $.messager.alert("提示", '请选择一条记录');
            return;
        }
        var data = ids.join(",");
        $.ajax({
            url: '/amcs/monitorArea/couldDelete',
            contentType : "application/json" ,
            data: JSON.stringify(objArr) ,
            cache: false,
            success: function (result) {
                if (result.status == 0) {
                    if (result.data.code == 0) {
                        $.messager.confirm('确认', '你确定要删除选定的' + num + '条记录吗?', function (r) {
                            if (r) {
                                $.ajax({
                                    url: "/amcs/monitorArea/delete",
                                    data: { 'ids': data },
                                    success: function (result) {
                                        if (result.status == 0) {
                                            $('#areaTable').datagrid("reload");
                                            Msg.success("提示", "删除成功");
                                            $('#areaTable').datagrid("clearSelections");
                                        } else {
                                            Msg.error("错误", result.data || result.message);
                                        }
                                    }
                                });
                            }
                        });
                    } else {
                        $("#delete_Msg").html('');
						$("#delete_dialog").dialog("open");
						$('#delete_tip_dg').datagrid({
							view: scrollview,
							// rownumbers: true,
							singleSelect:true,
							pageSize: 6,
							columns: [[
								{field: "seq", title: "序号", width: "5%",align:'center',formatter:function(value,row,index){
									return index+1;
									}},
								{field: "camName", title: "摄像机名称", width: "30%",halign:'center'},
								{field: "presetName", title: "预置位名称", width: "20%",halign:'center'},
								{field: "cardList", title: "巡检卡片名称", width: "46%",halign:'center'}
							]],
							data: result.data.reason,
							onLoadSuccess: function (data) {
							/*	let rows = $('#delete_tip_dg').datagrid("getRows");
								if(rows.length>0){
									for(let i=0;i<rows.length;i++){
										let camName = rows[i].camName;
										let presetName = rows[i].presetName;
										let cardList = rows[i].cardList;
									}
								}*/
								if (data.rows.length < 6) {
									document.querySelector('#delete_dialog .datagrid-view2 #datagrid-body').style.overflowY = 'hidden'
								} else {
									document.querySelector('#delete_dialog .datagrid-view2 #datagrid-body').style.overflowY = ''
								}

							}

						})
						return;
                    }
                }
            },
            error: function () {
                Msg.error("错误", "网络中断，不能删除");
            }
        });
    }
  	
  	//导出巡检点位
    function exportPoint() {
    	var data = getQueryParams();
        window.location.href = '/amcs/monitorArea/export?keyword='+data.keyword+'&cameraName='+data.cameraName+'&equipName='+data.equipName;
    }
  	
  	//打开导入弹窗
    function showImportDialog() {
        $("#file").filebox({ required: true, buttonText: '请选择excel文件', prompt: '最大允许上传20M的文件', accept: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel' });
        $("#remindMsg").html('');
        $("#import_dialog").dialog("open");
    }
    //开始导入
    function importMonitorArea() {
        $("#remindMsg").html("");
        var file = $("#file").filebox('getValue');
        if(!file){
            Msg.error("请选择需要导入的文件！");
            return;
        }
        ajaxSubmitForm("monitorareaImport","/amcs/monitorArea/import",showImportMsg, showImportMsg);
    }
    //显示导入信息
    function showImportMsg(result) {
        $("#remindMsg").html('');
        var newHtml = result.message;
        if (result.data) {
            for (var i = 0; i < result.data.length; i++) {
                if(i == 0){
                    newHtml += "：" + result.data[i] + "<br>";
                }else{
                    newHtml += "<font style='color:Lightcoral;'>"+ result.data[i] + "</font><br>";
                }
            }
        }
        $("#remindMsg").html(newHtml);
        $("#file").filebox('clear');
        // 导入完成后刷新表格。
        queryData();
    }
	function formatValue(val){
		return val || '--';
	}
    
</script>
